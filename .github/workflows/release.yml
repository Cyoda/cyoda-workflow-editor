name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Mint a short-lived GitHub App token so the "Version packages" PR (and the
      # branch it pushes) is authored by the app, not the built-in GITHUB_TOKEN.
      # GitHub refuses to trigger workflows from GITHUB_TOKEN-authored events, so
      # a token-authored Version PR never runs CI/preflight and can't satisfy the
      # required checks on main. An app token sidesteps that loop-prevention.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          # No `registry-url`: that would write an .npmrc with a placeholder
          # `_authToken`. Publishing authenticates via npm trusted publishing
          # (OIDC, `id-token: write` above), not a token — see
          # ai/npm-release-mechanism.md "Provenance and authentication".

      # npm trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      # `pnpm publish` (via `changeset publish`) shells out to this npm.
      # Exact pin, >= 14 days old (supply-chain cooldown, like pnpm-workspace.yaml).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.2 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build must precede Typecheck: `pnpm typecheck` now covers apps/ as
      # well as packages/, and apps/docs-embed-demo resolves @cyoda/workflow-*
      # through each package's built dist/*.d.ts. On a clean checkout those do
      # not exist yet, so typechecking first fails with TS2307.
      - name: Validate workspace
        run: pnpm build && pnpm typecheck && pnpm test

      - name: Run release preflight
        run: pnpm release:preflight

      - name: Create version PR or publish changed packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: Version packages
          title: Version packages
        # No NPM_TOKEN: with it unset and OIDC available, changesets/action leaves
        # .npmrc alone and npm uses trusted publishing. Each package's trusted
        # publisher allows only *staged* publishing, so `pnpm release`
        # (scripts/release-publish.mjs) runs `npm stage publish` instead of
        # `changeset publish`. New versions are not live until a maintainer
        # approves them on npmjs.com (see ai/npm-release-mechanism.md).
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
